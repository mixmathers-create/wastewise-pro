// DO NOT EDIT THIS FILE! IT IS GENERATED EACH TIME "capacitor update" IS RUN

android {
  compileOptions {
      sourceCompatibility JavaVersion.VERSION_21
      targetCompatibility JavaVersion.VERSION_21
  }
}

// Apply Cordova variables only when the generated file exists to prevent build failures
// in environments without cordova plugins.
def cordovaVariablesFile = new File(rootProject.projectDir, "capacitor-cordova-android-plugins/cordova.variables.gradle")
if (cordovaVariablesFile.exists()) {
  apply from: cordovaVariablesFile
}

dependencies {
    implementation project(':capacitor-camera')
    implementation project(':capacitor-mlkit-barcode-scanning')

}

if (hasProperty('postBuildExtras')) {
  postBuildExtras()
}
